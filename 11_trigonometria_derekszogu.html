<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trigonometria Gyakorló - PHM</title>
    <style>
        :root {
            --bordo: #BA0527;
            --bordo-light: #FDF2F4;
            --dark: #1E293B;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #F8FAFC;
            color: var(--dark);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            background: white;
            max-width: 650px;
            width: 100%;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            border-top: 6px solid var(--bordo);
        }
        h1 { color: var(--bordo); margin-top: 0; font-size: 24px; text-align: center; }
        .score-board {
            display: flex; justify-content: space-between; background: var(--bordo-light);
            padding: 10px 15px; border-radius: 8px; font-weight: bold; margin-bottom: 20px;
        }
        .canvas-container { text-align: center; margin-bottom: 20px; }
        canvas { background: #fff; border: 1px solid #e2e8f0; border-radius: 8px; }
        .task-card {
            background: #F1F5F9; padding: 15px; border-radius: 8px; font-size: 1.1rem; margin-bottom: 20px;
        }
        .input-group { display: flex; gap: 10px; align-items: center; margin-bottom: 20px; flex-wrap: wrap; }
        input[type="number"] {
            padding: 10px; font-size: 1rem; border: 2px solid #CBD5E1;
            border-radius: 6px; width: 120px; outline: none;
        }
        input[type="number"]:focus { border-color: var(--bordo); }
        .btn {
            padding: 10px 20px; font-size: 1rem; font-weight: bold; border: none;
            border-radius: 6px; cursor: pointer; transition: 0.2s;
        }
        .btn-check { background: var(--bordo); color: white; }
        .btn-check:hover { background: #96031E; }
        .btn-next { background: #475569; color: white; }
        .btn-next:hover { background: #334155; }
        .feedback { font-weight: normal; padding: 15px; border-radius: 8px; display: none; margin-bottom: 20px; line-height: 1.5; }
        .feedback.correct { background: #DCFCE7; color: #166534; display: block; font-weight: bold; }
        .feedback.hint { background: #FFFBEB; border: 1px solid #FCD34D; color: #92400E; display: block; }
        .hint-title { font-weight: bold; font-size: 1.05rem; margin-bottom: 8px; color: #B45309; }
        .formula-box { background: rgba(255,255,255,0.7); padding: 8px 12px; border-radius: 6px; margin: 8px 0; font-family: monospace; font-size: 0.95rem; }
    </style>
</head>
<body>

<div class="container">
    <h1>Derékszögű háromszög - Trigonometria</h1>
    
    <div class="score-board">
        <span>Helyes válaszok: <span id="score">0</span></span>
        <span>Összes próbálkozás: <span id="total">0</span></span>
    </div>

    <div class="canvas-container">
        <canvas id="triangleCanvas" width="360" height="240"></canvas>
    </div>

    <div class="task-card" id="taskText">Feladat betöltése...</div>

    <div id="feedback" class="feedback"></div>

    <div class="input-group">
        <label for="userAnswer"><strong>Válaszod:</strong></label>
        <input type="number" id="userAnswer" step="0.1" placeholder="0.0">
        <span id="unitText">cm</span>
        <button class="btn btn-check" onclick="checkAnswer()">Ellenőrzés</button>
        <button class="btn btn-next" onclick="generateTask()">Új feladat</button>
    </div>
</div>

<script>
    let currentTask = {};
    let score = 0;
    let total = 0;
    let answered = false;
    let taskQueue = [];

    const canvas = document.getElementById('triangleCanvas');
    const ctx = canvas.getContext('2d');

    function drawTriangle(labels) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // 4-féle orientáció véletlenszerű sorsolása
        const orientation = Math.floor(Math.random() * 4);
        
        let A, B, C;
        // C a derékszögű csúcs, A-nál van az alpha szög, B a másik hegyesszög
        if (orientation === 0) {
            // Jobb alsó derékszög
            C = { x: 290, y: 190 };
            A = { x: 50,  y: 190 };
            B = { x: 290, y: 40 };
        } else if (orientation === 1) {
            // Bal alsó derékszög
            C = { x: 70,  y: 190 };
            A = { x: 310, y: 190 };
            B = { x: 70,  y: 40 };
        } else if (orientation === 2) {
            // Jobb felső derékszög
            C = { x: 290, y: 40 };
            A = { x: 50,  y: 40 };
            B = { x: 290, y: 190 };
        } else {
            // Bal felső derékszög
            C = { x: 70,  y: 40 };
            A = { x: 310, y: 40 };
            B = { x: 70,  y: 190 };
        }

        // Háromszög rajzolása
        ctx.beginPath();
        ctx.moveTo(A.x, A.y);
        ctx.lineTo(C.x, C.y);
        ctx.lineTo(B.x, B.y);
        ctx.closePath();
        ctx.lineWidth = 3;
        ctx.strokeStyle = '#1E293B';
        ctx.stroke();

        // Derékszög négyzetének rajzolása
        const dx1 = Math.sign(A.x - C.x) * 15;
        const dy2 = Math.sign(B.y - C.y) * 15;
        ctx.beginPath();
        ctx.moveTo(C.x + dx1, C.y);
        ctx.lineTo(C.x + dx1, C.y + dy2);
        ctx.lineTo(C.x, C.y + dy2);
        ctx.lineWidth = 1;
        ctx.strokeStyle = '#64748B';
        ctx.stroke();

        // Feliratok elhelyezése
        ctx.font = 'bold 14px Arial';
        ctx.fillStyle = '#BA0527';

        // Átfogó (c) középértéke
        const midCX = (A.x + B.x) / 2;
        const midCY = (A.y + B.y) / 2;
        const offsetX_c = (midCX < canvas.width / 2) ? -35 : 15;
        ctx.fillText(labels.c, midCX + offsetX_c, midCY);

        // BC oldal ('a' befogó - szöggel szemközti)
        const midAX = (B.x + C.x) / 2;
        const midAY = (B.y + C.y) / 2;
        const offsetX_a = (C.x > canvas.width / 2) ? 12 : -65;
        ctx.fillText(labels.a, midAX + offsetX_a, midAY);

        // AC oldal ('b' befogó - szög melletti)
        const midBX = (A.x + C.x) / 2;
        const midBY = (A.y + C.y) / 2;
        const offsetY_b = (C.y > canvas.height / 2) ? 20 : -10;
        ctx.fillText(labels.b, midBX - 20, midBY + offsetY_b);

        // Alpha szög jelölése A csúcsnál
        const alphaOffsetX = (A.x < C.x) ? 25 : -45;
        const alphaOffsetY = (A.y > B.y) ? -10 : 20;
        ctx.fillText(labels.alpha, A.x + alphaOffsetX, A.y + alphaOffsetY);
    }

    function refillQueue() {
        const pool = [
            'sin_find_a',   
            'cos_find_b',   
            'tan_find_a',   
            'sin_find_c',   
            'cos_find_c',   
            'find_alpha_sin'
        ];
        for (let i = pool.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [pool[i], pool[j]] = [pool[j], pool[i]];
        }
        taskQueue = pool;
    }

    function generateTask() {
        answered = false;
        document.getElementById('userAnswer').value = '';
        document.getElementById('feedback').className = 'feedback';
        
        if (taskQueue.length === 0) {
            refillQueue();
        }
        const taskType = taskQueue.pop();

        const alpha = Math.floor(Math.random() * 40) + 25; 
        const alphaRad = alpha * (Math.PI / 180);
        const c = Math.floor(Math.random() * 15) + 10; 
        const a = +(c * Math.sin(alphaRad)).toFixed(1);
        const b = +(c * Math.cos(alphaRad)).toFixed(1);

        if (taskType === 'sin_find_a') {
            currentTask = {
                text: `Adott a c = ${c} cm átfogó és az α = ${alpha}° hegyesszög. Számítsd ki a szöggel szemközti 'a' befogó hosszát! (1 tizedesjegyre kerekítve)`,
                target: a,
                unit: 'cm',
                labels: { a: 'a = ?', b: 'b', c: `c = ${c} cm`, alpha: `α = ${alpha}°` }
            };
        } else if (taskType === 'cos_find_b') {
            currentTask = {
                text: `Adott a c = ${c} cm átfogó és az α = ${alpha}° hegyesszög. Számítsd ki a szög melletti 'b' befogó hosszát! (1 tizedesjegyre kerekítve)`,
                target: b,
                unit: 'cm',
                labels: { a: 'a', b: 'b = ?', c: `c = ${c} cm`, alpha: `α = ${alpha}°` }
            };
        } else if (taskType === 'tan_find_a') {
            currentTask = {
                text: `Adott a szög melletti b = ${b} cm befogó és az α = ${alpha}° hegyesszög. Számítsd ki a szöggel szemközti 'a' befogó hosszát! (1 tizedesjegyre kerekítve)`,
                target: a,
                unit: 'cm',
                labels: { a: 'a = ?', b: `b = ${b} cm`, c: 'c', alpha: `α = ${alpha}°` }
            };
        } else if (taskType === 'sin_find_c') {
            currentTask = {
                text: `Adott az a = ${a} cm befogó és a vele szemközti α = ${alpha}° szög. Számítsd ki a 'c' átfogó hosszát! (1 tizedesjegyre kerekítve)`,
                target: c,
                unit: 'cm',
                labels: { a: `a = ${a} cm`, b: 'b', c: 'c = ?', alpha: `α = ${alpha}°` }
            };
        } else if (taskType === 'cos_find_c') {
            currentTask = {
                text: `Adott a szög melletti b = ${b} cm befogó és az α = ${alpha}° szög. Számítsd ki a 'c' átfogó hosszát! (1 tizedesjegyre kerekítve)`,
                target: c,
                unit: 'cm',
                labels: { a: 'a', b: `b = ${b} cm`, c: 'c = ?', alpha: `α = ${alpha}°` }
            };
        } else {
            currentTask = {
                text: `Adott az a = ${a} cm befogó és a c = ${c} cm átfogó. Számítsd ki az 'a' oldallal szemközti α szöget fokban! (1 tizedesjegyre kerekítve)`,
                target: alpha,
                unit: '°',
                labels: { a: `a = ${a} cm`, b: 'b', c: `c = ${c} cm`, alpha: 'α = ?' }
            };
        }

        document.getElementById('taskText').innerText = currentTask.text;
        document.getElementById('unitText').innerText = currentTask.unit;
        drawTriangle(currentTask.labels);
    }

    function checkAnswer() {
        const val = parseFloat(document.getElementById('userAnswer').value);
        const feedback = document.getElementById('feedback');

        if (isNaN(val)) {
            alert('Kérlek, írj be egy számot!');
            return;
        }

        if (!answered) {
            total++;
            document.getElementById('total').innerText = total;
        }

        const diff = Math.abs(val - currentTask.target);

        if (diff <= 0.2) {
            if (!answered) {
                score++;
                document.getElementById('score').innerText = score;
            }
            answered = true;
            feedback.innerText = 'Helyes válasz! Szép munka!';
            feedback.className = 'feedback correct';
        } else {
            feedback.className = 'feedback hint';
            feedback.innerHTML = `
                <div class="hint-title">Sajnos nem pontos. Gondold át újra!</div>
                <div><strong>Segítség a feladathoz:</strong></div>
                <ul>
                    <li>Milyen adatokat ismersz az ábráról, és mi az ismeretlen?</li>
                    <li>Melyik szögfüggvény köti össze a megadott és a keresett adatokat?</li>
                </ul>
                <div class="hint-title" style="margin-top:10px;">Emlékeztető (szögfüggvények definíciói):</div>
                <div class="formula-box">
                    • <strong>sin(α)</strong> = szöggel szemközti befogó / átfogó<br>
                    • <strong>cos(α)</strong> = szög melletti befogó / átfogó<br>
                    • <strong>tg(α)</strong> = szöggel szemközti befogó / szög melletti befogó
                </div>
                <div style="margin-top:10px; font-weight:bold;">Számold újra, és próbáld meg még egyszer!</div>
            `;
        }
    }

    generateTask();
</script>

</body>
</html>
