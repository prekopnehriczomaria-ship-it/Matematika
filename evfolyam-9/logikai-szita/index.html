<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logikai Szita Gyakorló </title>
    <!-- FontAwesome Ikonok -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --jezsuita-bordo: #BA0527;
            --jezsuita-bordo-dark: #8C031D;
            --jezsuita-bordo-light: #FDF2F4;
            --jezsuita-arany: #BA9F05;
            --jezsuita-arany-hover: #9E8704;
            --accent-green: #0BBA05;
            --accent-green-hover: #099B04;
            --accent-blue: #0527BA;
            --accent-blue-hover: #041E96;
            --bg-color: #F8FAFC;
            --text-dark: #1E293B;
        }

        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text-dark);
        }

        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(186, 5, 39, 0.1);
            max-width: 750px;
            width: 100%;
            border-top: 6px solid var(--jezsuita-bordo);
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        h1 {
            color: var(--jezsuita-bordo);
            margin: 0;
            font-size: 26px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .score-board {
            background-color: var(--jezsuita-bordo-light);
            color: var(--jezsuita-bordo-dark);
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 15px;
            border: 1px solid rgba(186, 5, 39, 0.2);
        }

        .mode-select {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        .mode-btn {
            padding: 10px 22px;
            border: 2px solid var(--jezsuita-bordo);
            background-color: #fff;
            color: var(--jezsuita-bordo);
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
        }

        .mode-btn.active, .mode-btn:hover {
            background-color: var(--jezsuita-bordo);
            color: #fff;
            box-shadow: 0 4px 10px rgba(186, 5, 39, 0.25);
        }

        .card {
            background-color: #FFF;
            border: 1px solid #E2E8F0;
            border-left: 6px solid var(--jezsuita-bordo);
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
        }

        .task-content {
            flex: 1;
        }

        .task-icon-container {
            font-size: 38px;
            color: var(--jezsuita-bordo);
            background: var(--jezsuita-bordo-light);
            padding: 15px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 75px;
            height: 75px;
            min-width: 75px;
            border: 1px solid rgba(186, 5, 39, 0.15);
            animation: popIn 0.3s ease-out;
        }

        @keyframes popIn {
            0% { transform: scale(0.6); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .task-text {
            font-size: 17px;
            line-height: 1.6;
            margin: 0;
        }

        .input-section {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        input[type="number"] {
            flex: 1;
            padding: 14px;
            font-size: 16px;
            border: 2px solid #CBD5E1;
            border-radius: 8px;
            outline: none;
        }

        input[type="number"]:focus {
            border-color: var(--jezsuita-bordo);
        }

        .btn-check {
            padding: 14px 24px;
            border: none;
            background-color: var(--accent-green);
            color: white;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-check:hover {
            background-color: var(--accent-green-hover);
        }

        .button-group {
            display: flex;
            gap: 12px;
        }

        .btn-next {
            flex: 1;
            padding: 12px;
            border: none;
            background-color: var(--jezsuita-arany);
            color: white;
            font-size: 15px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-next:hover {
            background-color: var(--jezsuita-arany-hover);
        }

        .btn-finish {
            padding: 12px 20px;
            border: none;
            background-color: var(--accent-blue);
            color: white;
            font-size: 15px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-finish:hover {
            background-color: var(--accent-blue-hover);
        }

        .feedback {
            padding: 18px;
            border-radius: 8px;
            font-size: 15px;
            display: none;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .feedback.success {
            display: block;
            background-color: #D1FAE5;
            color: #065F46;
            border: 1px solid #A7F3D0;
            font-weight: bold;
        }

        .feedback.error {
            display: block;
            background-color: #FEF3C7;
            color: #92400E;
            border: 1px solid #FDE68A;
        }

        /* --- MODAL (ÖSSZEGZŐ ABLAK) --- */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0,0,0,0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-content {
            background-color: #fff;
            border-radius: 16px;
            max-width: 650px;
            width: 100%;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        .modal-header {
            background-color: var(--jezsuita-bordo);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .modal-header h2 {
            margin: 0;
            font-size: 22px;
        }

        .modal-body {
            padding: 20px;
            overflow-y: auto;
            flex: 1;
        }

        .summary-stats {
            display: flex;
            justify-content: space-around;
            background-color: var(--jezsuita-bordo-light);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
        }

        .stat-item .val {
            font-size: 24px;
            font-weight: bold;
            color: var(--jezsuita-bordo);
        }

        .stat-item .lbl {
            font-size: 13px;
            color: #64748B;
        }

        .history-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .history-item {
            border-bottom: 1px solid #E2E8F0;
            padding: 12px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .history-item:last-child {
            border-bottom: none;
        }

        .history-info {
            font-size: 14px;
            flex: 1;
        }

        .badge {
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
        }

        .badge.correct { background-color: #D1FAE5; color: #065F46; }
        .badge.incorrect { background-color: #FEE2E2; color: #991B1B; }

        .modal-footer {
            padding: 15px 20px;
            background-color: #F8FAFC;
            border-top: 1px solid #E2E8F0;
            display: flex;
            justify-content: flex-end;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-bar">
        <h1><i class="fa-solid fa-circle-nodes"></i> Logikai Szita</h1>
        <div class="score-board" id="score-display">Eredmény: 0 / 0 (0%)</div>
    </div>

    <div class="mode-select">
        <button class="mode-btn active" id="btn-2" onclick="setMode(2)">2 halmaz</button>
        <button class="mode-btn" id="btn-3" onclick="setMode(3)">3 halmaz</button>
    </div>

    <div class="card">
        <div class="task-content">
            <p class="task-text" id="task-text">A feladat betöltése...</p>
        </div>
        <div class="task-icon-container" id="icon-container">
            <i class="fa-solid fa-graduation-cap" id="task-icon"></i>
        </div>
    </div>

    <div class="input-section">
        <input type="number" id="user-answer" placeholder="Írd ide a válaszod (szám)..." min="0" onkeydown="if(event.key==='Enter') checkAnswer()">
        <button class="btn-check" id="check-btn" onclick="checkAnswer()">Ellenőrzés</button>
    </div>

    <div id="feedback" class="feedback"></div>

    <div class="button-group">
        <button class="btn-next" onclick="generateTask()"><i class="fa-solid fa-rotate-right"></i> Új feladat</button>
        <button class="btn-finish" onclick="showSummary()"><i class="fa-solid fa-flag-checkered"></i> Gyakorlás befejezése</button>
    </div>
</div>

<!-- ÖSSZEGZŐ MODAL -->
<div class="modal-overlay" id="summary-modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2>Gyakorlás Összegzése</h2>
        </div>
        <div class="modal-body">
            <div class="summary-stats">
                <div class="stat-item">
                    <div class="val" id="stat-total">0</div>
                    <div class="lbl">Összes feladat</div>
                </div>
                <div class="stat-item">
                    <div class="val" id="stat-correct">0</div>
                    <div class="lbl">Helyes válasz</div>
                </div>
                <div class="stat-item">
                    <div class="val" id="stat-percent">0%</div>
                    <div class="lbl">Sikeresség</div>
                </div>
            </div>
            <h3>Feladatok részletei:</h3>
            <ul class="history-list" id="history-list-container">
                <!-- Dinamikusan töltődik fel -->
            </ul>
        </div>
        <div class="modal-footer">
            <button class="mode-btn active" onclick="restartPractice()">Új gyakorlás indítása</button>
        </div>
    </div>
</div>

<script>
    let currentMode = 2;
    let currentSolution = 0;
    let currentHint = "";
    let currentTaskTitle = "";

    // Statisztika nyomon követése
    let totalAttempted = 0;
    let totalCorrect = 0;
    let taskHistory = [];
    let isCurrentTaskAnswered = false;

    // Ismétlődés elkerülésére
    let last2SetTypeIndex = -1;
    let last3SetTypeIndex = -1;

    function rand(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function setMode(mode) {
        currentMode = mode;
        document.getElementById('btn-2').classList.toggle('active', mode === 2);
        document.getElementById('btn-3').classList.toggle('active', mode === 3);
        generateTask();
    }

    function updateIcon(iconClass) {
        const iconEl = document.getElementById('task-icon');
        const container = document.getElementById('icon-container');
        iconEl.className = `fa-solid ${iconClass}`;
        container.style.animation = 'none';
        container.offsetHeight;
        container.style.animation = 'popIn 0.3s ease-out';
    }

    function updateScoreDisplay() {
        const percent = totalAttempted > 0 ? Math.round((totalCorrect / totalAttempted) * 100) : 0;
        document.getElementById('score-display').innerText = `Eredmény: ${totalCorrect} / ${totalAttempted} (${percent}%)`;
    }

    function generateTask() {
        document.getElementById('user-answer').value = '';
        const feedbackEl = document.getElementById('feedback');
        feedbackEl.className = 'feedback';
        feedbackEl.style.display = 'none';
        isCurrentTaskAnswered = false;

        if (currentMode === 2) {
            generate2SetTask();
        } else {
            generate3SetTask();
        }
    }

    // --- 2 HALMAZOS FELADATOK ---
    function generate2SetTask() {
        const themes = [
            { 
                group: "osztályban", A: "angolt tanul", B: "németet tanul", 
                A_only: "angolt tanul", B_only: "németet tanul", 
                both_statement: "mindkét nyelvet tanulják", neither_statement: "egyik nyelvet sem tanulják", 
                q_both: "mindkét nyelvet tanulják", q_neither: "egyik nyelvet sem tanulják", q_at_least_one: "legalább az egyik nyelvet tanulják",
                icon: "fa-language" 
            },
            { 
                group: "sportegyesületben", A: "fociznak", B: "kosárlabdáznak", 
                A_only: "focizik", B_only: "kosárlabdázik", 
                both_statement: "mindkét sportot űzik", neither_statement: "egyik sportot sem űzik", 
                q_both: "mindkét sportot űzik", q_neither: "egyik sportot sem űzik", q_at_least_one: "legalább az egyik sportot űzik",
                icon: "fa-basketball" 
            },
            { 
                group: "csoportban", A: "kutyát tartanak", B: "macskát tartanak", 
                A_only: "kutyát tart", B_only: "macskát tart", 
                both_statement: "mindkét állatot tartják", neither_statement: "egyik állatot sem tartják", 
                q_both: "mindkét állatot tartják", q_neither: "egyik állatot sem tartják", q_at_least_one: "legalább az egyik állatot tartják",
                icon: "fa-paw" 
            },
            { 
                group: "évfolyamon", A: "matek szakkörre járnak", B: "fizika szakkörre járnak", 
                A_only: "matek szakkörre jár", B_only: "fizika szakkörre jár", 
                both_statement: "mindkét szakkörre járnak", neither_statement: "egyik szakkörre sem járnak", 
                q_both: "mindkét szakkörre járnak", q_neither: "egyik szakkörre sem járnak", q_at_least_one: "legalább az egyik szakkörre járnak",
                icon: "fa-calculator" 
            },
            { 
                group: "társaságban", A: "pizzát rendeltek", B: "hamburgert rendeltek", 
                A_only: "pizzát rendelt", B_only: "hamburgert rendelt", 
                both_statement: "mindkettőt rendeltek", neither_statement: "egyiket sem rendelték", 
                q_both: "mindkettőt rendelték", q_neither: "egyiket sem rendelték", q_at_least_one: "legalább az egyiket rendelték",
                icon: "fa-pizza-slice" 
            },
            { 
                group: "gamer klubban", A: "PC-n játszanak", B: "konzolon játszanak", 
                A_only: "PC-n játszik", B_only: "konzolon játszik", 
                both_statement: "mindkettőn játszanak", neither_statement: "egyik eszközt sem használják", 
                q_both: "mindkettőn játszanak", q_neither: "egyik eszközt sem használják", q_at_least_one: "legalább az egyik eszközön játszanak",
                icon: "fa-gamepad" 
            }
        ];

        const theme = themes[rand(0, themes.length - 1)];
        updateIcon(theme.icon);

        const onlyA = rand(6, 15);
        const onlyB = rand(6, 15);
        const both = rand(3, 10);
        const neither = rand(2, 8);

        const totalGroup = onlyA + onlyB + both + neither;
        const countA = onlyA + both;
        const countB = onlyB + both;

        const taskTypes = ['find_intersection', 'find_neither', 'find_only_A', 'find_only_B', 'find_at_least_one'];
        
        let typeIndex;
        do {
            typeIndex = rand(0, taskTypes.length - 1);
        } while (typeIndex === last2SetTypeIndex && taskTypes.length > 1);
        last2SetTypeIndex = typeIndex;

        const type = taskTypes[typeIndex];
        let text = "";

        if (type === 'find_intersection') {
            currentTaskTitle = `2 halmaz: Metszet (${theme.group})`;
            text = `Egy ${totalGroup} fős ${theme.group} ${countA}-an ${theme.A}, és ${countB}-en ${theme.B}. `;
            text += `Tudjuk, hogy ${neither} diák ${theme.neither_statement}. `;
            text += `<br><br><strong>Kérdés:</strong> Hányan vannak azok, akik <strong>${theme.q_both.toUpperCase()}</strong>?`;

            currentSolution = both;
            currentHint = `<strong>Segítség:</strong> Számold ki először, hányan vannak, akik legalább az egyiket választják (vonjad ki a teljes létszámból a semelyiket).<br>
            A két csoport összegéből (|A| + |B|) vond ki ezt a kapott létszámot, így megkapod a metszetet!`;
        } 
        else if (type === 'find_neither') {
            currentTaskTitle = `2 halmaz: Semelyik (${theme.group})`;
            text = `Egy ${totalGroup} fős ${theme.group} ${countA}-an ${theme.A}, és ${countB}-en ${theme.B}. `;
            text += `Tudjuk, hogy ${both} diák ${theme.both_statement}. `;
            text += `<br><br><strong>Kérdés:</strong> Hányan vannak olyanok, akik <strong>${theme.q_neither.toUpperCase()}</strong>?`;

            currentSolution = neither;
            currentHint = `<strong>Segítség:</strong> Számold ki a legalább az egyik lehetőséget választók számát az unió képlettel: |A ∪ B| = |A| + |B| - |A ∩ B|.<br>
            Az eredményt vond ki a teljes csoport létszámából!`;
        }
        else if (type === 'find_only_A') {
            currentTaskTitle = `2 halmaz: Csak első (${theme.A_only})`;
            text = `Egy ${totalGroup} fős ${theme.group} ${countA}-an ${theme.A}, ${countB}-en ${theme.B}. `;
            text += `Tudjuk, hogy ${both}-en ${theme.both_statement}. `;
            text += `<br><br><strong>Kérdés:</strong> Hányan vannak, akik <strong>CSAK ${theme.A_only.toUpperCase()}</strong> (de ${theme.B_only} nem)?`;

            currentSolution = onlyA;
            currentHint = `<strong>Segítség (Lényeglátás):</strong> A feladatban a teljes létszám (${totalGroup}) és a másik csoport létszáma (${countB}) **zavaró / felesleges adatok**!<br>
            A válaszhoz elegendő az első csoport teljes létszámát és a közös résztvevők számát vizsgálnod.`;
        }
        else if (type === 'find_only_B') {
            currentTaskTitle = `2 halmaz: Csak második (${theme.B_only})`;
            text = `Egy ${totalGroup} fős ${theme.group} ${countA}-an ${theme.A}, ${countB}-en ${theme.B}. `;
            text += `Tudjuk, hogy ${both}-en ${theme.both_statement}. `;
            text += `<br><br><strong>Kérdés:</strong> Hányan vannak, akik <strong>CSAK ${theme.B_only.toUpperCase()}</strong> (de ${theme.A_only} nem)?`;

            currentSolution = onlyB;
            currentHint = `<strong>Segítség (Lényeglátás):</strong> A feladatban a teljes létszám (${totalGroup}) és a másik csoport létszáma (${countA}) **zavaró / felesleges adatok**!<br>
            A válaszhoz elegendő a második csoport teljes létszámát és a közös résztvevők számát vizsgálnod.`;
        }
        else if (type === 'find_at_least_one') {
            currentTaskTitle = `2 halmaz: Legalább az egyik (${theme.group})`;
            text = `Egy ${totalGroup} fős ${theme.group} ${countA}-an ${theme.A}, ${countB}-en ${theme.B}, és ${both}-en ${theme.both_statement}. `;
            text += `<br><br><strong>Kérdés:</strong> Hányan vannak, akik <strong>${theme.q_at_least_one.toUpperCase()}</strong>?`;

            currentSolution = countA + countB - both;
            currentHint = `<strong>Segítség:</strong> Használd a két halmaz uniójának képletét: |A ∪ B| = |A| + |B| - |A ∩ B|.<br>
            *(A teljes létszám itt zavaró/felesleges adat volt).*`;
        }

        document.getElementById('task-text').innerHTML = text;
    }

    // --- 3 HALMAZOS FELADATOK ---
    function generate3SetTask() {
        const themes3 = [
            { group: "osztályban", A: "Matek", B: "Fizika", C: "Informatika", verb: "tanulják", icon: "fa-book-open" },
            { group: "évfolyamon", A: "Angol", B: "Német", C: "Spanyol", verb: "tanulják", icon: "fa-earth-americas" },
            { group: "sportegyesületben", A: "Foci", B: "Kosárlabda", C: "Úszás", verb: "sportágat űzik", icon: "fa-trophy" },
            { group: "diákcsoportban", A: "Okostelefon", B: "Laptop", C: "Tablet", verb: "eszközzel rendelkeznek", icon: "fa-laptop" },
            { group: "fiatalklubban", A: "TikTok", B: "Instagram", C: "YouTube", verb: "alkalmazást használják", icon: "fa-mobile-screen" }
        ];

        const theme = themes3[rand(0, themes3.length - 1)];
        updateIcon(theme.icon);

        const onlyA = rand(4, 8);
        const onlyB = rand(4, 8);
        const onlyC = rand(4, 8);
        
        const AB_only = rand(2, 5);
        const AC_only = rand(2, 5);
        const BC_only = rand(2, 5);
        
        const allThree = rand(2, 5);
        const none = rand(2, 6);

        const countA = onlyA + AB_only + AC_only + allThree;
        const countB = onlyB + AB_only + BC_only + allThree;
        const countC = onlyC + AC_only + BC_only + allThree;

        const countAB = AB_only + allThree;
        const countAC = AC_only + allThree;
        const countBC = BC_only + allThree;

        const calculatedTotal = onlyA + onlyB + onlyC + AB_only + AC_only + BC_only + allThree + none;

        let text = `Egy ${calculatedTotal} fős ${theme.group} felmérése során a következő adatokat gyűjtöttük össze a 3 téma (${theme.A}, ${theme.B}, ${theme.C}) kapcsán:<br><br>`;
        text += `• ${theme.A}: ${countA} fő | • ${theme.B}: ${countB} fő | • ${theme.C}: ${countC} fő<br>`;
        text += `• ${theme.A} és ${theme.B} is: ${countAB} fő<br>`;
        text += `• ${theme.A} és ${theme.C} is: ${countAC} fő<br>`;
        text += `• ${theme.B} és ${theme.C} is: ${countBC} fő<br>`;

        let type;
        do {
            type = rand(1, 5);
        } while (type === last3SetTypeIndex);
        last3SetTypeIndex = type;

        if (type === 1) {
            currentTaskTitle = `3 halmaz: Semelyik (${theme.A}/${theme.B}/${theme.C})`;
            text += `• Mindhármat (${theme.A}, ${theme.B}, ${theme.C}): ${allThree} fő<br><br>`;
            text += `<strong>Kérdés:</strong> Hányan vannak, akik <strong>EGYIKET SEM</strong> választották?`;
            
            currentSolution = none;
            currentHint = `<strong>Segítség:</strong> Számold ki a 3 halmaz unióját (legalább egyet választók):<br>
            |A ∪ B ∪ C| = |A| + |B| + |C| - |A∩B| - |A∩C| - |B∩C| + |A∩B∩C|<br>
            Ezt az unió értéket vonjad ki a teljes csoport létszámából!`;
        } 
        else if (type === 2) {
            currentTaskTitle = `3 halmaz: Mindhárom (${theme.A}/${theme.B}/${theme.C})`;
            text += `• Egyiket sem választotta: ${none} fő<br><br>`;
            text += `<strong>Kérdés:</strong> Hányan vannak, akik <strong>MINDHÁRMAT</strong> választották?`;
            
            currentSolution = allThree;
            currentHint = `<strong>Segítség:</strong> Számold ki, hányan választottak legalább egyet (vonjad ki a teljes létszámból a semelyiket).<br>
            Írd fel a 3 halmazos képletet:<br>
            |A ∪ B ∪ C| = |A| + |B| + |C| - |A∩B| - |A∩C| - |B∩C| + |A∩B∩C|<br>
            Itt az egyetlen ismeretlen a mindhárom metszete (|A∩B∩C|).`;
        }
        else if (type === 3) {
            currentTaskTitle = `3 halmaz: Pontosan kettő (${theme.A}/${theme.B}/${theme.C})`;
            text += `• Mindhármat (${theme.A}, ${theme.B}, ${theme.C}): ${allThree} fő | • Egyiket sem: ${none} fő<br><br>`;
            text += `<strong>Kérdés:</strong> Hányan vannak, akik <strong>PONTOSAN KÉT</strong> kategóriát választottak?`;

            currentSolution = AB_only + AC_only + BC_only;
            currentHint = `<strong>Segítség (Lényeglátás):</strong> A teljes létszám, az egyéni létszámok és a semelyik csoport zavaró adatok!<br>
            A páros metszetekből (pl. A ∩ B) mindegyiknél ki kell vonnod a mindhármat választók számát, hogy megkapd a "csak két" kategóriát választókat, majd add össze őket!`;
        }
        else if (type === 4) {
            currentTaskTitle = `3 halmaz: Csak az A (${theme.A})`;
            text += `• Mindhármat (${theme.A}, ${theme.B}, ${theme.C}): ${allThree} fő | • Egyiket sem: ${none} fő<br><br>`;
            text += `<strong>Kérdés:</strong> Hányan vannak, akik <strong>CSAK A(Z) ${theme.A.toUpperCase()}</strong> kategóriát választották (a másik kettőt nem)?`;

            currentSolution = onlyA;
            currentHint = `<strong>Segítség (Lényeglátás):</strong> Csak a(z) ${theme.A}-ra vonatkozó adatok kellenek!<br>
            Az összes ${theme.A} létszámából vond ki a két páros metszetet (A∩B és A∩C), majd add hozzá az egyszer túlvont mindhárom metszetét!`;
        }
        else if (type === 5) {
            currentTaskTitle = `3 halmaz: Legalább kettő (${theme.A}/${theme.B}/${theme.C})`;
            text += `• Mindhármat (${theme.A}, ${theme.B}, ${theme.C}): ${allThree} fő | • Egyiket sem: ${none} fő<br><br>`;
            text += `<strong>Kérdés:</strong> Hányan vannak, akik <strong>LEGALÁBB KÉT</strong> kategóriát választottak?`;

            currentSolution = AB_only + AC_only + BC_only + allThree;
            currentHint = `<strong>Segítség:</strong> A legalább kettőt választók a páros metszetek uniója.<br>
            Ha összeadod a 3 páros metszetet, a mindhármat választókat háromszor számoltad be. Ebből kell levonnod 2 × (mindhármat választók) értékét!`;
        }

        document.getElementById('task-text').innerHTML = text;
    }

    // --- ELLENŐRZÉS ÉS STATISZTIKA ---
    function checkAnswer() {
        const inputVal = document.getElementById('user-answer').value.trim();
        const feedbackEl = document.getElementById('feedback');

        if (inputVal === "") {
            feedbackEl.className = "feedback error";
            feedbackEl.innerHTML = "Kérlek, írj be egy számot a válaszadáshoz!";
            feedbackEl.style.display = "block";
            return;
        }

        const userVal = Number(inputVal);
        const isCorrect = (userVal === currentSolution);

        if (!isCurrentTaskAnswered) {
            totalAttempted++;
            if (isCorrect) totalCorrect++;
            
            taskHistory.push({
                title: currentTaskTitle,
                userAnswer: userVal,
                correctAnswer: currentSolution,
                isCorrect: isCorrect
            });

            isCurrentTaskAnswered = true;
            updateScoreDisplay();
        }

        if (isCorrect) {
            feedbackEl.className = "feedback success";
            feedbackEl.innerHTML = "🎉 Ügyes vagy! Helyes válasz!";
        } else {
            feedbackEl.className = "feedback error";
            feedbackEl.innerHTML = `❌ Sajnos nem jó válasz.<br><br>${currentHint}`;
        }
        feedbackEl.style.display = "block";
    }

    // --- ÖSSZEGZÉS MEGJELENÍTÉSE ---
    function showSummary() {
        document.getElementById('stat-total').innerText = totalAttempted;
        document.getElementById('stat-correct').innerText = totalCorrect;
        const percent = totalAttempted > 0 ? Math.round((totalCorrect / totalAttempted) * 100) : 0;
        document.getElementById('stat-percent').innerText = `${percent}%`;

        const listContainer = document.getElementById('history-list-container');
        listContainer.innerHTML = '';

        if (taskHistory.length === 0) {
            listContainer.innerHTML = '<li style="text-align:center; color:#64748B; padding:15px;">Még nem oldottál meg egyetlen feladatot sem.</li>';
        } else {
            taskHistory.forEach((item, idx) => {
                const li = document.createElement('li');
                li.className = 'history-item';
                li.innerHTML = `
                    <div class="history-info">
                        <strong>#${idx + 1} ${item.title}</strong><br>
                        Válaszod: ${item.userAnswer} | Helyes válasz: ${item.correctAnswer}
                    </div>
                    <span class="badge ${item.isCorrect ? 'correct' : 'incorrect'}">
                        ${item.isCorrect ? 'Helyes' : 'Hibás'}
                    </span>
                `;
                listContainer.appendChild(li);
            });
        }

        document.getElementById('summary-modal').style.display = 'flex';
    }

    function restartPractice() {
        totalAttempted = 0;
        totalCorrect = 0;
        taskHistory = [];
        updateScoreDisplay();
        document.getElementById('summary-modal').style.display = 'none';
        generateTask();
    }

    window.onload = function() {
        generateTask();
    };
</script>

</body>
</html>
